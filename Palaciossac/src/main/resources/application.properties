spring.application.name=palaciossac-api
spring.config.import=optional:file:.env[.properties],optional:file:Palaciossac/.env[.properties]
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=3600

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/palaciossac_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

server.port=8080